<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetNode 管理大屏 - 宠物智能健康监测</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <style>
    :root {
      --bg-primary: #f0f2f5;
      --bg-panel: #ffffff;
      --bg-card: #fafbfc;
      --border-subtle: rgba(0,0,0,0.06);
      --border-active: rgba(0,150,210,0.3);
      --text-primary: #1a1d26;
      --text-secondary: #5a6070;
      --text-muted: #9aa0b0;
      --accent-cyan: #009a8c;
      --accent-red: #e0314b;
      --accent-green: #1fa855;
      --accent-orange: #e67e22;
      --accent-blue: #3366cc;
      --accent-purple: #7c3aed;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      --font-sans: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header (thick cyan top bar) ── */
    .dashboard-header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--accent-cyan);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-logo { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #fff; }
    .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.35); }
    .header-subtitle { font-size: 12px; color: rgba(255,255,255,0.8); letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .header-live {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      color: #fff; background: rgba(255,255,255,0.15);
      padding: 4px 10px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.25);
    }
    .header-live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent-red);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(224,49,75,0.6); }
      50% { opacity: 0.4; box-shadow: 0 0 0 6px rgba(224,49,75,0); }
    }
    .header-time { font-size: 13px; color: rgba(255,255,255,0.85); font-family: var(--font-mono); }
    .header-exit {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 6px 16px; border-radius: 4px;
      cursor: pointer; font-size: 12px; font-family: inherit;
      transition: all 0.2s;
    }
    .header-exit:hover { background: rgba(255,255,255,0.25); border-color: #fff; color: #fff; }

    /* ── Main Layout ── */
    .dashboard-main {
      display: flex;
      height: calc(100vh - 52px);
    }

    /* ── Left Panel (60%) ── */
    .left-panel {
      flex: 0 0 60%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
    }
    .map-container {
      flex: 3;
      position: relative;
      overflow: hidden;
      min-height: 0;
      background-image: url('assets/images/chongqing.png');
      background-position: var(--map-bg-pos, 0px 0px);
      background-repeat: no-repeat;
      background-color: #ffffff;
      cursor: grab;
    }
    .map-container:active { cursor: grabbing; }
    .map-container.dragging { cursor: grabbing; }
    /* Calibration bar */
    .map-calibrate-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 28px;
      background: rgba(255,255,255,0.92);
      display: flex; align-items: center; justify-content: center; gap: 16px;
      z-index: 15; font-size: 11px; color: var(--text-muted);
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .map-calibrate-bar span { font-family: var(--font-mono); }
    .map-calibrate-reset {
      background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.1);
      color: var(--text-secondary); padding: 2px 10px; border-radius: 3px;
      cursor: pointer; font-size: 10px; font-family: inherit;
      transition: all 0.2s;
    }
    .map-calibrate-reset:hover { background: rgba(0,144,200,0.08); border-color: var(--border-active); color: var(--accent-cyan); }
    .map-edit-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); cursor: pointer; font-family: var(--font-sans); }
    .map-edit-toggle input { accent-color: var(--accent-cyan); cursor: pointer; }
    #map-chart {
      width: 100%;
      height: 100%;
    }
    /* Curtain overlay */
    .map-curtain {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0c10; transform: translateY(-100%);
      pointer-events: none; z-index: 10;
    }
    .map-curtain.active { transition: transform 0.35s cubic-bezier(0.76,0,0.24,1); }
    .map-curtain.phase1 { transform: translateY(0); }
    .map-curtain.phase2 { transform: translateY(100%); }

    /* InfoBox popup */
    .map-infobox {
      position: absolute; z-index: 20;
      background: rgba(255,255,255,0.96); border: 1px solid var(--border-active);
      border-radius: 6px; padding: 14px 18px; min-width: 200px;
      pointer-events: none; opacity: 0; transform: translateY(6px);
      transition: opacity 0.25s, transform 0.25s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .map-infobox.visible { opacity: 1; transform: translateY(0); }
    .map-infobox .info-device { font-size: 11px; color: #333; font-family: var(--font-mono); margin-bottom: 6px; }
    .map-infobox .info-dim-hint { font-size: 10px; color: #555; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(0,0,0,0.08); letter-spacing: 0.5px; }
    .map-infobox .info-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; padding: 2px 0; transition: background 0.2s; }
    .map-infobox .info-row.info-row-active { background: rgba(0,0,0,0.04); margin: 0 -6px 4px; padding: 3px 6px; border-radius: 3px; }
    .map-infobox .info-label { color: #333; }
    .map-infobox .info-value { color: #000; font-weight: 600; }
    .map-infobox .info-row-active .info-label { color: #000; font-weight: 700; }
    .map-infobox .info-row-active .info-value { font-size: 13px; color: #000; font-weight: 700; }

    /* AI Chat — DeepSeek-style clean UI */
    .chat-container {
      flex: 1;
      border-top: 3px solid var(--accent-cyan);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-panel);
    }
    .chat-header {
      display: flex; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid var(--border-subtle);
    }
    .chat-header-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 2px; }
    .chat-msg { display: flex; flex-direction: column; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .chat-msg.system { align-items: flex-start; }
    .chat-msg.user { align-items: flex-end; }
    .chat-msg.system .chat-bubble {
      background: #f5f6f8; border-radius: 4px 12px 12px 12px;
      color: var(--text-primary); font-size: 13px; line-height: 1.75;
      padding: 10px 16px; max-width: 88%;
    }
    .chat-msg.user .chat-bubble {
      background: #e3f0fd; border-radius: 12px 4px 12px 12px;
      color: var(--text-primary); font-size: 13px; line-height: 1.75;
      padding: 10px 16px; max-width: 88%;
    }
    .chat-bubble em { font-style: normal; font-weight: 600; color: var(--accent-cyan); }
    .chat-input-area {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px 16px; border-top: 1px solid var(--border-subtle);
    }
    .chat-input {
      flex: 1; background: #f5f6f8; border: 2px solid transparent;
      border-radius: 20px; padding: 10px 18px; color: var(--text-primary);
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .chat-input:focus { border-color: var(--accent-cyan); background: #fff; }
    .chat-send {
      background: var(--accent-cyan); border: none;
      color: #fff; padding: 10px 22px; border-radius: 20px;
      cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
      transition: opacity 0.2s;
    }
    .chat-send:hover { opacity: 0.85; }

    /* ── Right Panel (40%) ── */
    .right-panel {
      flex: 0 0 40%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel);
    }
    .right-panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 24px; border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .right-panel-header h3 { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--text-secondary); }
    .right-panel-status { font-size: 12px; color: var(--accent-green); font-family: var(--font-mono); }
    .right-panel-scroll {
      flex: 1; overflow-y: auto; padding: 0;
    }
    .right-panel-scroll::-webkit-scrollbar { width: 3px; }
    .right-panel-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 2px; }

    /* ── Element Plus Overrides for Light Theme ── */
    .el-collapse {
      border: none;
      --el-collapse-header-bg-color: #d5d8dd;
      --el-collapse-content-bg-color: #e8f5e9;
      --el-collapse-border-color: rgba(0,0,0,0.04);
    }
    .el-collapse-item {
      border: 1px solid rgba(0,0,0,0.06) !important;
      border-radius: 2px;
      margin-bottom: 0;
    }
    .el-collapse-item:hover { border-color: rgba(0,0,0,0.12) !important; }
    .el-collapse-item.is-active { border-color: rgba(0,0,0,0.15) !important; }
    .el-collapse-item__header {
      background: #d5d8dd !important;
      border: none !important;
      color: var(--text-secondary) !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      padding: 16px 20px !important;
      height: auto !important;
      line-height: 1.4 !important;
      letter-spacing: 0.5px;
      transition: background 0.25s, color 0.25s;
    }
    .el-collapse-item__header:hover { background: #c8ccd2 !important; color: var(--text-primary) !important; }
    .el-collapse-item.is-active .el-collapse-item__header {
      color: #2e7d32 !important;
      background: #c8e6c9 !important;
      border-bottom: 1px solid rgba(46,125,50,0.12) !important;
    }
    .el-collapse-item__wrap { background: #e8f5e9 !important; border: none !important; }
    .el-collapse-item__content { padding: 16px 20px !important; color: var(--text-secondary); }
    .el-collapse-item__arrow { color: var(--text-muted) !important; }
    .el-collapse-item.is-active .el-collapse-item__arrow { color: #2e7d32 !important; }

    /* Radio group */
    .panel-radio-group { margin-bottom: 12px; display: flex; justify-content: flex-end; }
    .el-radio-group .el-radio-button__inner {
      background: #fafbfc !important;
      border-color: rgba(0,0,0,0.08) !important;
      color: var(--text-muted) !important;
      font-size: 11px !important;
      padding: 6px 14px !important;
    }
    .el-radio-group .el-radio-button__original-radio:checked + .el-radio-button__inner {
      background: rgba(0,150,210,0.08) !important;
      border-color: rgba(0,150,210,0.3) !important;
      color: var(--accent-cyan) !important;
      box-shadow: none !important;
    }

    /* Alert */
    .el-alert { margin-bottom: 14px; border-radius: 4px !important; }
    .el-alert--error {
      background: rgba(224,49,75,0.05) !important;
      border: 1px solid rgba(224,49,75,0.15) !important;
    }
    .el-alert__title { font-size: 12px !important; color: var(--accent-red) !important; }

    /* Chart containers */
    .chart-area-wrapper { position: relative; }
    .chart-box { width: 100%; height: 220px; }
    .chart-stats-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 16px; }
    .chart-stat-item { flex: 1; min-width: 80px; }
    .chart-stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .chart-stat-value { font-size: 18px; font-weight: 700; font-family: var(--font-mono); }

    /* Accordion header custom layout */
    .collapse-header-custom {
      display: flex; align-items: center; width: 100%; gap: 12px;
    }
    .collapse-marker {
      width: 9px; height: 9px; border-radius: 50%;
      background: #c0c4cc; flex-shrink: 0;
      transition: all 0.3s;
    }
    .is-active .collapse-marker { background: #e8a840; box-shadow: 0 0 6px rgba(232,168,64,0.35); }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="header-left">
      <span class="header-logo">PETNODE</span>
      <div class="header-divider"></div>
      <span class="header-subtitle">管理大屏 · 态势感知</span>
    </div>
    <div class="header-right">
      <span class="header-live"><span class="header-live-dot"></span>LIVE</span>
      <span class="header-time">{{ currentTime }}</span>
      <button class="header-exit" @click="exitDashboard">退出大屏</button>
    </div>
  </div>

  <!-- Main -->
  <div class="dashboard-main">
    <!-- Left Panel: Map + Chat -->
    <div class="left-panel">
      <div class="map-container" ref="mapContainer" @wheel.prevent="onMapWheel" :style="{ backgroundSize: (bgScale * 100) + '%' }">
        <div id="map-chart"></div>
        <div class="map-curtain" ref="curtainEl"></div>
        <div class="map-infobox" ref="infoboxEl">
          <div class="info-device">{{ infobox.deviceId }}</div>
          <div class="info-dim-hint" v-if="infobox.dimName">当前维度：{{ infobox.dimName }}</div>
          <div class="info-row" v-for="row in infobox.rows" :class="{ 'info-row-active': row.active }">
            <span class="info-label">{{ row.label }}</span>
            <span class="info-value" :style="{ color: row.color }">{{ row.value }}</span>
          </div>
        </div>
        <!-- Calibration bar -->
        <div class="map-calibrate-bar">
          <label class="map-edit-toggle"><input type="checkbox" v-model="mapEditMode"> 调整地图</label>
          <span>X: {{ bgOffset.x }} &middot; Y: {{ bgOffset.y }} &middot; {{ (bgScale * 100).toFixed(0) }}%</span>
          <button class="map-calibrate-reset" @click="resetBgOffset">重置</button>
        </div>
      </div>
      <div class="chat-container">
        <div class="chat-header">
          <span class="chat-header-title">AI 智能简报与分析</span>
        </div>
        <div class="chat-messages" ref="chatMessages">
          <template v-for="(msg, i) in chatList" :key="i">
            <div class="chat-msg" :class="msg.type">
              <div class="chat-bubble" v-html="msg.text"></div>
            </div>
          </template>
        </div>
        <div class="chat-input-area">
          <input class="chat-input" v-model="chatInput" placeholder="输入宠物健康问题..." @keydown.enter="sendChat">
          <button class="chat-send" @click="sendChat">发送</button>
        </div>
      </div>
    </div>

    <!-- Right Panel: Accordion -->
    <div class="right-panel">
      <div class="right-panel-header">
        <h3>◇ 数据指标面板</h3>
        <span class="right-panel-status" ref="panelStatus">系统就绪</span>
      </div>
      <div class="right-panel-scroll">
        <el-collapse v-model="activePanel" @change="onPanelChange">
          <el-collapse-item
            v-for="(dim, idx) in dimensions"
            :key="idx"
            :title="dim.title"
            :name="idx"
          >
            <template #title>
              <div class="collapse-header-custom">
                <span class="collapse-marker"></span>
                <span>{{ dim.title }}</span>
              </div>
            </template>

            <!-- Time mode switch -->
            <div class="panel-radio-group">
              <el-radio-group v-model="dim.timeMode" size="small" @change="onTimeModeChange(idx)">
                <el-radio-button label="realtime">实时模式</el-radio-button>
                <el-radio-button label="24h">过去24小时</el-radio-button>
                <el-radio-button label="7d">过去7天</el-radio-button>
              </el-radio-group>
            </div>

            <!-- Alert: use v-show so DOM stays stable; chart sibling is never replaced -->
            <el-alert
              v-show="dim.alerts[dim.timeMode]"
              :title="dim.alerts[dim.timeMode] || ''"
              type="error"
              :closable="false"
              show-icon
            />

            <!-- Chart area wrapped in stable container to prevent Vue DOM reuse -->
            <div class="chart-area-wrapper">
              <div class="chart-box" :ref="el => setChartRef(idx, el)"></div>
              <div class="chart-stats-row">
                <div v-for="stat in dim.stats" class="chart-stat-item">
                  <div class="chart-stat-label">{{ stat.label }}</div>
                  <div class="chart-stat-value" :style="{color: stat.color}">{{ stat.value }}</div>
                </div>
              </div>
            </div>
          </el-collapse-item>
        </el-collapse>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "vue": "https://cdn.jsdelivr.net/npm/vue@3.4/dist/vue.esm-browser.prod.js",
    "element-plus": "https://cdn.jsdelivr.net/npm/element-plus@2.7/dist/index.full.min.mjs",
    "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.5/dist/echarts.esm.min.js"
  }
}
</script>

<script type="module">
import { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick, watch } from 'vue';
import ElementPlus from 'element-plus';
import * as echarts from 'echarts';

const app = createApp({
  setup() {
    /* ================================================================
       Mock Data — 7 dimensions aligned with the data dictionary
       ================================================================ */

    // Chongqing districts with real lat/lng centers
    const districts = [
      { name: '渝北区', lng: 106.49, lat: 29.62, devices: 26 },
      { name: '江北区', lng: 106.51, lat: 29.59, devices: 22 },
      { name: '沙坪坝区', lng: 106.43, lat: 29.56, devices: 20 },
      { name: '渝中区', lng: 106.53, lat: 29.56, devices: 14 },
      { name: '南岸区', lng: 106.54, lat: 29.53, devices: 21 },
      { name: '九龙坡区', lng: 106.47, lat: 29.52, devices: 19 },
      { name: '大渡口区', lng: 106.45, lat: 29.50, devices: 12 },
      { name: '巴南区', lng: 106.52, lat: 29.48, devices: 18 },
    ];

    // Dog breeds, sizes, statuses, anomalies
    const dogBreeds = ['金毛','柯基','泰迪','哈士奇','边牧','法斗','柴犬','萨摩耶','德牧','比熊','拉布拉多','博美'];
    const dogSizes = ['大型犬','中型犬','小型犬'];
    const statusLabels = ['运动','静息','睡眠'];
    const anomalyLabels = ['无异常','心脏异常','骨骼异常','呼吸异常'];

    function seedRand(s) { const m=0x6D2B79F5; let a=(s|0)*m; a=(a^a>>>15)*m; a=(a^a>>>7)*m; return ((a^a>>>14)>>>0)/4294967296; }

    // Generate 50 devices with real lat/lng distributed across districts
    const allDevices = [];
    for (let i = 0; i < 50; i++) {
      const didx = i % districts.length;
      const dist = districts[didx];
      const rng = seedRand(i * 137 + 42);
      const dogSize = dogSizes[Math.floor(rng * 3)];
      const heartRate = Math.round(55 + rng * 110);
      const statusIdx = Math.floor(rng * 3);
      const respRate = Math.round(8 + rng * 32);
      const temp = (37.5 + rng * 3.5).toFixed(1);
      const pace = Math.round(rng * 120);
      const anomalyIdx = rng < 0.7 ? 0 : Math.floor(rng * 3 + 1);

      allDevices.push({
        deviceId: 'PN' + String(i + 1).padStart(4, '0'),
        district: dist.name,
        lng: dist.lng + (rng - 0.5) * 0.04,
        lat: dist.lat + (rng - 0.5) * 0.03,
        dogSize, heartRate,
        status: statusLabels[statusIdx],
        respRate,
        temperature: parseFloat(temp),
        pace,
        anomaly: anomalyLabels[anomalyIdx],
      });
    }

    /* ── 7 Dimensions ── */
    const dimensions = reactive([
      {
        id: 'dogSize',
        title: '设备绑定犬型分布',
        timeMode: 'realtime',
        alerts: {
          realtime: '渝北区大型犬项圈占比异常偏高 (56%)，建议关注大型犬运动量管理',
          '24h': '过去24小时新增绑定大型犬 3 台、中型犬 2 台、小型犬 1 台，比率正常',
          '7d': '过去7天大型犬新增绑定 12 台，中型犬仅 3 台，比例失衡',
        },
        stats: [
          { label: '大型犬', value: '42%', color: '#ff3b5c' },
          { label: '中型犬', value: '35%', color: '#448aff' },
          { label: '小型犬', value: '23%', color: '#00e676' },
        ],
        getPieData() {
          return [
            { value: 42, name: '大型犬', itemStyle: { color: '#ff3b5c' } },
            { value: 35, name: '中型犬', itemStyle: { color: '#448aff' } },
            { value: 23, name: '小型犬', itemStyle: { color: '#00e676' } },
          ];
        },
        getBarData() {
          return {

    /* ── Map background drag + zoom calibration ── */
    const MAP_STORAGE_KEY = 'petnode_map_calib_v2';
    let saved = { x: 0, y: 0, s: 1 };
    try { const raw = localStorage.getItem(MAP_STORAGE_KEY); if (raw) saved = JSON.parse(raw); } catch (_) {}
    const bgOffset = reactive({ x: saved.x || 0, y: saved.y || 0 });
    const bgScale = ref(saved.s || 1);
    const mapEditMode = ref(false); // toggle to enable drag/zoom
    let dragInfo = null;

    function applyBgOffset() {
      const el = mapContainer.value;
      if (el) el.style.setProperty('--map-bg-pos', bgOffset.x + 'px ' + bgOffset.y + 'px');
    }
    function saveCalibration() {
      localStorage.setItem(MAP_STORAGE_KEY, JSON.stringify({ x: bgOffset.x, y: bgOffset.y, s: bgScale.value }));
      applyBgOffset();
    }
    function resetBgOffset() {
      bgOffset.x = 0; bgOffset.y = 0;
      bgScale.value = 1;
      saveCalibration();
    }

    function onMapWheel(e) {
      if (!mapEditMode.value) return;
      const el = mapContainer.value;
      if (!el) return;
      const delta = e.deltaY > 0 ? -0.06 : 0.06;
      const newScale = Math.max(0.15, Math.min(5, bgScale.value + delta));
      // Zoom toward mouse cursor
      const rect = el.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const ratio = newScale / bgScale.value;
      bgOffset.x = mx - ratio * (mx - bgOffset.x);
      bgOffset.y = my - ratio * (my - bgOffset.y);
      bgScale.value = newScale;
      saveCalibration();
    }

    function onMapMouseDown(e) {
      if (!mapEditMode.value || e.button !== 0) return;
      dragInfo = { sx: e.clientX, sy: e.clientY, ox: bgOffset.x, oy: bgOffset.y, active: false };
    }
    function onMapMouseMove(e) {
      if (!dragInfo) return;
      const dx = e.clientX - dragInfo.sx;
      const dy = e.clientY - dragInfo.sy;
      if (!dragInfo.active && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      dragInfo.active = true;
      mapContainer.value?.classList.add('dragging');
      bgOffset.x = dragInfo.ox + dx;
      bgOffset.y = dragInfo.oy + dy;
      applyBgOffset();
    }
    function onMapMouseUp() {
      if (dragInfo?.active) saveCalibration();
      dragInfo = null;
      mapContainer.value?.classList.remove('dragging');

            inst = buildPie(dom, dim.getPieData());
          } else {
            const bd = dim.getBarData();
            inst = buildBar(dom, bd.series, bd.categories);
          }
          panelCharts[idx] = inst;
          // Resize after collapse expansion animation settles (~350ms total)
          setTimeout(() => { if (inst && !inst.isDisposed()) inst.resize(); }, 120);
        }, 180);

    function renderMap() {
      const activeIdx = lastActiveIdx.value;
      const dim = activeIdx >= 0 && activeIdx < dimensions.length ? dimensions[activeIdx] : null;
      const B = MAP_BOUNDS;

      const seriesData = allDevices.map((d, i) => {
        const color = dim ? dim.getDeviceColor(d) : '#009a8c';

          value: [d.lng, d.lat, d.heartRate || 1],

          if (dim && dim.id === 'temperature') return d.temperature > 39 || d.temperature < 37.5;
          if (dim && dim.id === 'respiration') return d.respRate > 30 || d.respRate < 10;

          const dist = 0.003 + Math.random() * 0.012;
          pts.push({
            value: [ad.value[0] + Math.cos(angle) * dist, ad.value[1] + Math.sin(angle) * dist],
            itemStyle: { color: ad.itemStyle.color, opacity: 0.25 },

        return pts;

        backgroundColor: 'transparent',
        grid: { left: 0, right: 0, top: 0, bottom: 0 },
        xAxis: { type: 'value', min: B.lngMin, max: B.lngMax, show: false, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
        yAxis: { type: 'value', min: B.latMin, max: B.latMax, show: false, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
        series: [
          // ── Yangtze River (长江) — shorter, urban-core-only path ──
          {
            type: 'lines',
            coordinateSystem: 'cartesian2d',
            polyline: true,
            data: [{
              coords: [
                [106.45,29.544],[106.47,29.547],
                [106.485,29.550],[106.495,29.552],[106.502,29.554],[106.51,29.553],
                [106.52,29.550],
              ],
            }],
            lineStyle: { color: 'rgba(20,160,210,0.70)', width: 5, curveness: 0.2 },
            effect: { show: true, period: 6, trailLength: 0.3, symbol: 'circle', symbolSize: 2.5, color: 'rgba(20,180,230,0.50)' },
            zlevel: 0, silent: true,
          },
          // ── Jialing River (嘉陵江) — shorter path ──
          {
            type: 'lines',
            coordinateSystem: 'cartesian2d',
            polyline: true,
            data: [{
              coords: [
                [106.475,29.578],[106.48,29.570],
                [106.485,29.564],[106.49,29.558],[106.495,29.554],[106.50,29.554],
              ],
            }],
            lineStyle: { color: 'rgba(20,160,210,0.65)', width: 4.5, curveness: 0.15 },
            effect: { show: true, period: 5, trailLength: 0.25, symbol: 'circle', symbolSize: 2.5, color: 'rgba(20,180,230,0.45)' },
            zlevel: 0, silent: true,
          },
          // ── Confluence marker (朝天门) ──
          {
            type: 'effectScatter',
            coordinateSystem: 'cartesian2d',
            data: [{ value: [106.502, 29.554], itemStyle: { color: '#009a8c' } }],
            symbol: 'circle', symbolSize: 10,
            rippleEffect: { brushType: 'stroke', scale: 3, period: 2 },
            showEffectOn: 'render', zlevel: 1, silent: true,
          },
          // Heat fog
          {
            type: 'scatter', coordinateSystem: 'cartesian2d',
            data: heatFog, symbol: 'circle', symbolSize: 16, silent: true, zlevel: 0,
          },
          // Effect scatter anomaly glow
          {
            type: 'effectScatter', coordinateSystem: 'cartesian2d',
            data: anomalyData, symbol: 'circle', symbolSize: 14,
            rippleEffect: { brushType: 'stroke', scale: 3.2, period: 2.8 },
            showEffectOn: 'render', zlevel: 1,
          },
          // Main device scatter
          {
            type: 'scatter', coordinateSystem: 'cartesian2d',
            data: seriesData, symbol: 'circle',
            symbolSize: (val) => Math.max(5, Math.min(16, val[2] / 10)),
            label: { show: false },
            emphasis: { scale: 2.4, label: { show: true, formatter: '{b}', position: 'top', color: '#000', fontSize: 11, backgroundColor: 'rgba(255,255,255,0.85)', padding: [2,6], borderRadius: 3 } },
            zlevel: 2,
          },
        ],
      }, true);

      // ── InfoBox ──
      const actDim = lastActiveIdx.value >= 0 ? dimensions[lastActiveIdx.value] : null;

      function buildInfoRows(d) {
        const rows = [
          { label: '犬型',     value: d.dogSize,           color: d.dogSize === '大型犬' ? '#ff3b5c' : d.dogSize === '中型犬' ? '#448aff' : '#00e676' },
          { label: '心率',     value: d.heartRate + ' bpm', color: d.heartRate > 140 ? '#ff3b5c' : d.heartRate < 60 ? '#ff9100' : '#00e676' },
          { label: '行为状态', value: d.status,             color: d.status === '运动' ? '#ff3b5c' : d.status === '静息' ? '#00e676' : '#448aff' },
          { label: '呼吸频率', value: d.respRate + ' 次/分', color: d.respRate > 30 ? '#ff3b5c' : d.respRate < 10 ? '#ff9100' : '#00e676' },
          { label: '体温',     value: d.temperature.toFixed(1) + '°C', color: d.temperature > 39 ? '#ff3b5c' : d.temperature < 37.5 ? '#448aff' : '#00e676' },
          { label: '步频',     value: d.pace + ' 步/分',    color: d.pace > 80 ? '#ff3b5c' : '#00e676' },
          { label: '异常事件', value: d.anomaly,             color: d.anomaly === '心脏异常' ? '#d63031' : d.anomaly === '骨骼异常' ? '#636e72' : d.anomaly === '呼吸异常' ? '#e17055' : '#00b894' },
        ];
        if (actDim) rows.forEach((r, i) => { r.active = dimensions[i].id === actDim.id; });
        return rows;
      }

      mapChart.off('click');
      mapChart.on('click', (params) => {
        if (params.componentType === 'series' && params.seriesIndex === 5 && params.data.deviceIdx !== undefined) {
          const d = allDevices[params.data.deviceIdx];
          infobox.deviceId = d.deviceId;
          infobox.dimName = actDim ? actDim.title : '';
          infobox.rows = buildInfoRows(d);
          infobox.left = (params.event.offsetX + 20) + 'px';
          infobox.top = (params.event.offsetY - 60) + 'px';
          infobox.visible = true;
          clearTimeout(hideInfoboxTimer);
          hideInfoboxTimer = setTimeout(() => { infobox.visible = false; }, 5000);
        }
      });
    }

    /* ── Curtain animation ── */
    function triggerCurtain(callback) {
      const el = curtainEl.value;
      if (!el) { callback?.(); return; }
      el.classList.add('active');
      el.classList.add('phase1');
      el.classList.remove('phase2');
      setTimeout(() => {
        el.classList.remove('phase1');
        el.classList.add('phase2');
        callback?.();
      }, 350);
      setTimeout(() => {
        el.classList.remove('active', 'phase2');
      }, 750);
    }

    /* ── Panel change → update map + charts ── */
    function onPanelChange(activeNames) {
      if (activeNames.length > 0) {
        lastActiveIdx.value = activeNames[activeNames.length - 1];
      } else {
        // All panels closed → reset to default map
        lastActiveIdx.value = -1;
      }

      if (panelStatus.value && activeNames.length > 0) {
        const last = lastActiveIdx.value;
        panelStatus.value.textContent = '已展开 ' + activeNames.length + ' 个面板 · 当前: ' + dimensions[last].title;
      } else if (panelStatus.value) {
        panelStatus.value.textContent = '系统就绪';
      }

      // Always trigger curtain animation (open or close), so closing also has the transition
      triggerCurtain(() => renderMap());
    }

    function onTimeModeChange(idx) {
      renderPanelChart(idx);
    }

    /* ── Watch active panels for chart render / disposal ── */
    watch(activePanel, (newArr, oldArr) => {
      // Dispose charts for panels that were closed
      const closed = (oldArr || []).filter(n => !(newArr || []).includes(n));
      closed.forEach(n => {
        if (panelCharts[n]) { panelCharts[n].dispose(); panelCharts[n] = null; }
      });
      // Render charts for panels that were opened
      const opened = (newArr || []).filter(n => !(oldArr || []).includes(n));
      opened.forEach(n => {
        nextTick(() => renderPanelChart(n));
      });
    }, { deep: false });

    /* ── Exit ── */
    function exitDashboard() {
      if (confirm('确定退出管理大屏，返回 PetNode 官网？')) {
        window.location.href = 'index.html';
      }
    }

    /* ── Lifecycle ── */
    onMounted(() => {
      updateClock();
      clockTimer = setInterval(updateClock, 1000);
      applyBgOffset();
      nextTick(() => buildMapChart());

      // Handle resize
      window.addEventListener('resize', () => {
        mapChart?.resize();
        Object.values(panelCharts).forEach(c => c?.resize?.());
      });
      // Map drag + zoom
      const mc = mapContainer.value;
      if (mc) {
        mc.addEventListener('mousedown', onMapMouseDown);
        window.addEventListener('mousemove', onMapMouseMove);
        window.addEventListener('mouseup', onMapMouseUp);
      }
    });

    onUnmounted(() => {
      clearInterval(clockTimer);
      clearTimeout(curtainTimer);
      clearTimeout(hideInfoboxTimer);
      mapChart?.dispose();
      Object.values(panelCharts).forEach(c => c?.dispose?.());
      const mc = mapContainer.value;
      if (mc) mc.removeEventListener('mousedown', onMapMouseDown);
      window.removeEventListener('mousemove', onMapMouseMove);
      window.removeEventListener('mouseup', onMapMouseUp);
    });

    return {
      dimensions, activePanel, mapContainer, curtainEl, infoboxEl, chatMessages,
      panelStatus, infobox, bgOffset, currentTime, chatInput, chatList,
      sendChat, setChartRef, onPanelChange, onTimeModeChange, resetBgOffset, mapEditMode, onMapWheel, bgScale, exitDashboard,
    };
  },
});

app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
