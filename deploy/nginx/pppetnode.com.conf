# pppetnode.com 的 Nginx 反向代理 + 前端静态文件配置
# 目标服务器：47.108.239.80
# 域名通过 Cloudflare 代理（DNS Proxied / 橙色云朵）

# ─────────── Cloudflare 真实客户端 IP 还原 ───────────
# Cloudflare 的回源 IP 段（定期更新：https://www.cloudflare.com/ips/）
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ─────────── 变量映射：判断是否需要 HTTPS 重定向 ───────────
# 当 Cloudflare SSL 为 Flexible 时，回源走 HTTP 但带 X-Forwarded-Proto: https
# 此时不能 301 重定向，否则浏览器会无限循环
map $http_x_forwarded_proto $redirect_to_https {
    "https"  0;   # 已经通过 Cloudflare HTTPS 进来，不需要跳转
    default  1;   # 非 Cloudflare 的纯 HTTP 请求，需要跳转
}

# ─────────── HTTP (端口 80) ───────────
# 处理场景：
#   1. Cloudflare SSL 为 "Flexible" 时的回源请求（走 80，不跳转）
#   2. 非 Cloudflare 的直接 HTTP 访问（跳转到 HTTPS）
#   3. Let's Encrypt / ACME 证书验证
server {
    listen 80;
    listen [::]:80;
    server_name pppetnode.com www.pppetnode.com;

    # Let's Encrypt / Certbot 证书续期验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API 反向代理（Flexible 模式下也需要在 80 端口提供）
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件 / HTTPS 重定向
    location / {
        # 非 Cloudflare 来源的纯 HTTP 请求 → 强制跳转 HTTPS
        if ($redirect_to_https) {
            return 301 https://pppetnode.com$request_uri;
        }
        # Cloudflare Flexible 模式回源 → 直接提供前端文件
        root /var/www/pppetnode.com;
        try_files $uri $uri/ /index.html;
    }
}

# ─────────── HTTPS (端口 443) ───────────
# Cloudflare SSL 模式为 "Full" 或 "Full (Strict)" 时，回源走此 block
# 推荐：在 Cloudflare 设置 SSL 模式为 "Full (Strict)"，并使用 Cloudflare Origin Certificate
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pppetnode.com www.pppetnode.com;

    # ── SSL 证书配置 ──
    # 方案 A（推荐）：使用 Cloudflare Origin Certificate（15 年有效期，免续期）
    #   在 Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
    #   下载 .pem 和 .key 放到服务器：
    #     ssl_certificate     /etc/ssl/cloudflare/pppetnode.com.pem;
    #     ssl_certificate_key /etc/ssl/cloudflare/pppetnode.com.key;
    #
    # 方案 B：继续使用 Let's Encrypt（需确保 Certbot DNS 验证或暂停 CF 代理续期）
    ssl_certificate /etc/ssl/cloudflare/pppetnode.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pppetnode.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 安全头（注意：部分头如 HSTS 也可在 Cloudflare 面板统一设置）
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 前端静态文件（PetNode.com 目录内容部署到此路径）
    root /var/www/pppetnode.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果未来需要实时推送）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（Cloudflare 默认 100s 超时，源站应在此之前响应）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
