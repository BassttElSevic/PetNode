# pppetnode.com 的 Nginx 反向代理 + 前端静态文件配置
# 目标服务器：47.108.239.80
# 域名通过 Cloudflare 代理（DNS Proxy / 橙色云图标）

# ──────────────────────────────────────────────────────────────
# Cloudflare Real IP 还原
# Cloudflare 作为反向代理会覆盖客户端 IP，需要从 CF-Connecting-IP 还原真实 IP。
# 以下是 Cloudflare 的 IPv4/IPv6 地址段（需要定期更新）
# 参考：https://www.cloudflare.com/ips/
# ──────────────────────────────────────────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ──────────────────────────────────────────────────────────────
# HTTP (端口 80) —— 处理 Cloudflare 回源
# ──────────────────────────────────────────────────────────────
# 当 Cloudflare SSL 模式为 "Flexible" 时，CF 回源走 HTTP 80。
# 此时不能无条件 301 跳转 HTTPS（会造成无限重定向循环）。
# 解决方案：如果请求已经通过 Cloudflare HTTPS 入口进来
# （CF 会附加 X-Forwarded-Proto: https），则正常处理不跳转。
# 如果是直接 HTTP 访问（绕过 CF），则跳转到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name pppetnode.com www.pppetnode.com;

    # 前端静态文件
    root /var/www/pppetnode.com;
    index index.html;

    # 如果请求不是通过 HTTPS 入口进来的，则强制跳转 HTTPS
    # 覆盖场景：直接 HTTP 访问（空头）或显式 http 标头
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ──────────────────────────────────────────────────────────────
# HTTPS (端口 443) —— 处理 Cloudflare Full/Full(Strict) 回源
# ──────────────────────────────────────────────────────────────
# 当 Cloudflare SSL 模式为 "Full" 或 "Full (Strict)" 时，CF 回源走 HTTPS 443。
# 推荐使用 Cloudflare Origin Certificate（15年有效期，免费），
# 或者继续使用 Let's Encrypt 证书。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pppetnode.com www.pppetnode.com;

    # SSL 证书配置
    # 选项 A：Let's Encrypt 证书（当前配置）
    ssl_certificate /etc/letsencrypt/live/pppetnode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pppetnode.com/privkey.pem;
    # 选项 B：Cloudflare Origin Certificate（推荐，更简单）
    # ssl_certificate /etc/ssl/cloudflare/pppetnode.com.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/pppetnode.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 前端静态文件（PetNode.com 目录内容部署到此路径）
    root /var/www/pppetnode.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
