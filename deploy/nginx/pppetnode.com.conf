# pppetnode.com 的 Nginx 反向代理 + 前端静态文件配置
# 目标服务器：47.108.239.80

server {
    listen 80;
    listen [::]:80;
    server_name pppetnode.com www.pppetnode.com;

    return 301 https://pppetnode.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pppetnode.com www.pppetnode.com;

    ssl_certificate /etc/letsencrypt/live/pppetnode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pppetnode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 前端静态文件（PetNode.com 目录内容部署到此路径）
    root /var/www/pppetnode.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
